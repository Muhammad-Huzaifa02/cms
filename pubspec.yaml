name: cms
description: "CMS — Customer Management System. Internal branch tool for Meezan Bank."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # State management
  provider: ^6.1.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  shimmer: ^3.0.0

  # Export (FR-2.6: Admin-only export to Excel/PDF)
  excel: ^4.0.6
  pdf: ^3.11.1
  path_provider: ^2.1.4
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  # Widget/unit test mocks — used by test/widget_test.dart
  firebase_auth_mocks: ^0.14.1
  fake_cloud_firestore: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_logo.png

# Run `dart run flutter_launcher_icons` after `flutter pub get` to generate
# the actual Android/iOS launcher icons from assets/icon/app_logo.png.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A6B57"
  adaptive_icon_foreground: "assets/icon/app_logo.png"
  remove_alpha_ios: true
